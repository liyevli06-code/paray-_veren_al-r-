<!-- ═══════════════════════════════════════════════════════════════
     3D DÖYÜŞ ARENASI ADD-ON
     Bu bloku HeroicTeamBattle.html faylında, ən sonda, </body> teqindən
     dərhal ƏVVƏL yapışdır. Başqa heç nəyi dəyişmək lazım deyil.
═══════════════════════════════════════════════════════════════ -->
<style>
/* ── 3D səhnə ── */
.arena .fighter .hero-avatar.mid{display:none;}
.arena .hp-track{display:none;}
.a3d{
  --cw:clamp(104px,19vw,168px);--ch:calc(var(--cw) * 1.32);
  position:relative;height:clamp(270px,46vw,390px);margin:0 0 18px;
  border:1px solid var(--border);border-radius:var(--r);overflow:hidden;
  background:linear-gradient(180deg,#04060c 0%,#0a1024 55%,#141c38 100%);
  perspective:900px;perspective-origin:50% 34%;
}
.a3d-sky{
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 34% 46% at 10% 45%,rgba(46,95,163,.34),transparent 70%),
    radial-gradient(ellipse 34% 46% at 90% 45%,rgba(184,50,50,.34),transparent 70%),
    radial-gradient(ellipse 50% 40% at 50% 12%,rgba(228,176,74,.16),transparent 70%);
}
.a3d-world{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(4deg);animation:a3dCam 10s ease-in-out infinite;}
@keyframes a3dCam{0%,100%{transform:rotateX(4deg) rotateY(-1.6deg)}50%{transform:rotateX(4deg) rotateY(1.6deg)}}
.a3d-floor{
  position:absolute;left:-45%;right:-45%;bottom:0;height:400px;
  transform-origin:50% 100%;transform:rotateX(66deg);
  background:
    radial-gradient(ellipse 50% 60% at 50% 62%,rgba(228,176,74,.26),transparent 70%),
    repeating-linear-gradient(90deg,rgba(120,150,230,.24) 0 2px,transparent 2px 64px),
    repeating-linear-gradient(0deg,rgba(120,150,230,.24) 0 2px,transparent 2px 64px),
    linear-gradient(180deg,#0e1630,#1a2550);
  -webkit-mask-image:linear-gradient(0deg,#000 0%,#000 42%,transparent 100%);
  mask-image:linear-gradient(0deg,#000 0%,#000 42%,transparent 100%);
}
.a3d-fighter{position:absolute;bottom:15%;width:var(--cw);height:var(--ch);transform-style:preserve-3d;transform:translateZ(30px);}
.a3d-fighter.left{left:9%;}
.a3d-fighter.right{right:9%;}
.a3d-aura{position:absolute;inset:-16% -34%;background:radial-gradient(ellipse at 50% 55%,var(--hc,#888),transparent 64%);opacity:.34;filter:blur(16px);transform:translateZ(-40px);}
.a3d-shadow{position:absolute;left:-4%;right:-4%;bottom:-16px;height:24px;background:radial-gradient(ellipse,rgba(0,0,0,.75),transparent 70%);}
.a3d-body{position:absolute;inset:0;transform-style:preserve-3d;}
.a3d-card{position:absolute;inset:0;transform-style:preserve-3d;}
.a3d-fighter.left .a3d-card{animation:a3dSwayL 3.4s ease-in-out infinite;}
.a3d-fighter.right .a3d-card{animation:a3dSwayR 3.4s ease-in-out infinite;}
@keyframes a3dSwayL{0%,100%{transform:rotateY(26deg) translateY(0)}50%{transform:rotateY(14deg) translateY(-9px)}}
@keyframes a3dSwayR{0%,100%{transform:rotateY(-26deg) translateY(0)}50%{transform:rotateY(-14deg) translateY(-9px)}}
.a3d-layer{position:absolute;inset:0;border-radius:14px;}
.a3d-back{background:#0b1020;border:2px solid #444;}
.a3d-front{overflow:hidden;border:2px solid var(--hc,#888);box-shadow:0 0 26px -2px var(--hc,#888);}
.a3d-front img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 18%;display:block;}
.a3d-init{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:64px;color:rgba(255,255,255,.85);}
.a3d-front::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.22) 0%,transparent 34%,transparent 62%,rgba(0,0,0,.36) 100%);}
.a3d-hitflash{position:absolute;inset:0;background:#fff;opacity:0;z-index:3;}
.a3d-tag{position:absolute;left:50%;top:-38px;width:130%;transform:translateX(-50%) translateZ(34px);text-align:center;pointer-events:none;}
.a3d-tname{font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:.06em;color:#fff;text-shadow:0 2px 8px #000;white-space:nowrap;}
.a3d-thp{height:6px;width:78%;margin:2px auto 0;background:rgba(0,0,0,.65);border:1px solid var(--border);border-radius:3px;overflow:hidden;}
.a3d-thp i{display:block;height:100%;width:100%;background:#4CAF50;transition:width .4s,background .4s;}
.a3d-ghost{pointer-events:none;}
.a3d-ghost .a3d-tag{display:none;}
.a3d-fx{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:5;}
.a3d-dmg-layer{position:absolute;inset:0;pointer-events:none;z-index:7;overflow:hidden;}
.a3d-dmg{position:absolute;font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:.04em;color:#fff;text-shadow:0 0 14px currentColor,0 3px 0 #000;white-space:nowrap;transform:translate(-50%,0);}
.a3d-dmg.big{font-size:56px;color:#ffd54f;}
.a3d-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6;mix-blend-mode:screen;}
@media (prefers-reduced-motion:reduce){.a3d-world,.a3d-fighter .a3d-card{animation:none!important;}}
</style>

<script>
(function(){
'use strict';

/* ════════════════════════════════════
   YARDIMÇILAR
════════════════════════════════════ */
const R=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
const TAU=Math.PI*2;
function hexA(hx,a){const m=/^#?([0-9a-f]{6})$/i.exec(hx||'');if(!m)return'rgba(255,255,255,'+a+')';const n=parseInt(m[1],16);return'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';}

let stage,world,cv,cx,dmgLayer,flashEl,W=0,H=0,dpr=1,raf=0,last=0,ready=false;
const items=[],parts=[],tmr=[],S={left:{},right:{}},cur={left:null,right:null};
function later(fn,ms){const id=setTimeout(fn,ms);tmr.push(id);return id;}

/* ════════════════════════════════════
   SƏHNƏNİN QURULMASI
════════════════════════════════════ */
function buildStage(){
  const arena=document.getElementById('arena');
  if(!arena)return false;
  if(document.getElementById('a3d'))return true;
  const side=(cls,id)=>'<div class="a3d-fighter '+cls+'" id="'+id+'"><div class="a3d-aura"></div><div class="a3d-shadow"></div>'+
    '<div class="a3d-body"><div class="a3d-tag"><div class="a3d-tname">—</div><div class="a3d-thp"><i></i></div></div><div class="a3d-card"></div></div></div>';
  const st=document.createElement('div');st.className='a3d';st.id='a3d';
  st.innerHTML='<div class="a3d-sky"></div><div class="a3d-world" id="a3dWorld"><div class="a3d-floor"></div>'+side('left','a3dL')+side('right','a3dR')+'</div>'+
    '<canvas class="a3d-fx" id="a3dFx"></canvas><div class="a3d-dmg-layer" id="a3dDmg"></div><div class="a3d-flash" id="a3dFlash"></div>';
  arena.insertBefore(st,arena.firstChild);
  return true;
}
function init(){
  if(ready)return true;
  if(!buildStage())return false;
  const $=id=>document.getElementById(id);
  stage=$('a3d');world=$('a3dWorld');cv=$('a3dFx');cx=cv.getContext('2d');dmgLayer=$('a3dDmg');flashEl=$('a3dFlash');
  if(!cx)return false;
  [['left','a3dL'],['right','a3dR']].forEach(([s,id])=>{
    const f=$(id);
    S[s]={root:f,body:f.querySelector('.a3d-body'),card:f.querySelector('.a3d-card'),name:f.querySelector('.a3d-tname'),hp:f.querySelector('.a3d-thp i'),color:'#ffd54f'};
  });
  resize();
  if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);else window.addEventListener('resize',resize);
  ready=true;return true;
}
function resize(){
  const r=stage.getBoundingClientRect();if(!r.width)return;
  dpr=Math.min(2,window.devicePixelRatio||1);W=r.width;H=r.height;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);cx.setTransform(dpr,0,0,dpr,0,0);
}
function anchor(side){
  const sr=stage.getBoundingClientRect(),r=S[side].card.getBoundingClientRect();
  return{x:r.left-sr.left+r.width/2,y:r.top-sr.top+r.height*.45,w:r.width,h:r.height,side:side};
}

/* ════════════════════════════════════
   KAHRAMAN KARTI (real qalınlıqlı 3D lövhə)
════════════════════════════════════ */
function setFighter(side,h){
  if(!init()||!h)return;
  const s=S[side];
  const pct=Math.max(0,Math.min(100,(h.curHp/h.maxHp)*100));
  s.name.textContent=h.name;
  s.hp.style.width=pct+'%';
  s.hp.style.background=pct>50?'#4CAF50':pct>25?'#E4B04A':'#D44040';
  if(cur[side]===h.name)return;
  cur[side]=h.name;
  build(side,h);
}
function build(side,h){
  const s=S[side],col=h.color||'#888';
  s.color=col;
  s.body.getAnimations().forEach(a=>a.cancel());
  s.root.querySelectorAll('.a3d-ghost').forEach(g=>g.remove());
  s.root.style.setProperty('--hc',col);
  s.card.innerHTML='';
  const N=8;
  for(let i=N;i>=1;i--){
    const l=document.createElement('div');l.className='a3d-layer a3d-back';
    l.style.transform='translateZ('+(-i*3.5)+'px)';
    l.style.borderColor=hexA(col,Math.max(.25,.95-i*.09));
    s.card.appendChild(l);
  }
  const f=document.createElement('div');f.className='a3d-layer a3d-front';
  f.style.background='linear-gradient(160deg,'+col+',#0b1020)';
  f.innerHTML='<span class="a3d-init">'+(h.init||'')+'</span>'+(h.img?'<img src="'+h.img+'" alt="" onerror="this.style.display=\'none\'">':'')+'<div class="a3d-hitflash"></div>';
  s.card.appendChild(f);
  const d=side==='left'?-1:1;
  s.body.animate([
    {transform:'translate3d('+(d*170)+'px,-30px,-280px) scale(.7)'},
    {transform:'translate3d(0,0,0) scale(1)'}
  ],{duration:640,easing:'cubic-bezier(.2,.9,.25,1.12)'});
  later(()=>{if(!W)return;const a=anchor(side);burst(a.x,a.y+a.h*.5,16,'#9aa3b8',3,520,6,{g:.02,op:'source-over'});},480);
}

/* ════════════════════════════════════
   FX MOTORU (canvas)
════════════════════════════════════ */
function add(dur,draw,delay){items.push({t0:performance.now()+(delay||0),dur:dur,draw:draw});kick();}
function spawn(x,y,vx,vy,life,size,color,o){parts.push(Object.assign({x:x,y:y,vx:vx,vy:vy,life:life,max:life,size:size,color:color,g:0,d:.98},o||{}));kick();}
function burst(x,y,n,color,spd,life,size,o){for(let i=0;i<n;i++){const a=R(0,TAU),v=R(.3,1)*spd;spawn(x,y,Math.cos(a)*v,Math.sin(a)*v,R(life*.6,life),R(size*.5,size),color,o);}}
function kick(){if(!raf){last=performance.now();raf=requestAnimationFrame(loop);}}
function loop(now){
  raf=0;
  const dt=Math.min(50,now-last);last=now;
  if(W){
    cx.setTransform(dpr,0,0,dpr,0,0);
    cx.clearRect(0,0,W,H);
    for(let i=items.length-1;i>=0;i--){
      const it=items[i];
      if(now<it.t0)continue;
      const p=(now-it.t0)/it.dur;
      if(p>=1){items.splice(i,1);continue;}
      cx.save();cx.globalCompositeOperation='lighter';cx.lineCap='round';
      try{it.draw(cx,p,dt);}catch(e){items.splice(i,1);}
      cx.restore();
    }
    const k=dt/16.67;
    for(let i=parts.length-1;i>=0;i--){
      const p=parts[i];
      p.life-=dt;if(p.life<=0){parts.splice(i,1);continue;}
      p.x+=p.vx*k;p.y+=p.vy*k;p.vy+=p.g*k;
      const dr=Math.pow(p.d,k);p.vx*=dr;p.vy*=dr;
      if(p.vr)p.rot=(p.rot||0)+p.vr*k;
      const a=p.life/p.max,r=p.size*(1+(p.grow||0)*(1-a));
      cx.globalCompositeOperation=p.op||'lighter';
      cx.globalAlpha=a;cx.fillStyle=p.color;cx.strokeStyle=p.color;
      if(p.shape==='l'){cx.lineWidth=Math.max(1,r*.6);cx.lineCap='round';cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(p.x-p.vx*2.4,p.y-p.vy*2.4);cx.stroke();}
      else if(p.shape==='r'){cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot||0);cx.fillRect(-r,-r*.6,r*2,r*1.2);cx.restore();}
      else{cx.globalAlpha=a*.3;cx.beginPath();cx.arc(p.x,p.y,r*2.2,0,TAU);cx.fill();cx.globalAlpha=a;cx.beginPath();cx.arc(p.x,p.y,r,0,TAU);cx.fill();}
    }
    cx.globalAlpha=1;cx.globalCompositeOperation='source-over';
  } else {items.length=0;parts.length=0;}
  if(items.length||parts.length)raf=requestAnimationFrame(loop);
}

/* çəkmə köməkçiləri */
function line(c,x1,y1,x2,y2){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();}
function glow(c,color,w,blur){c.strokeStyle=color;c.lineWidth=w;c.shadowColor=color;c.shadowBlur=blur||16;}
function orb(c,x,y,r,col){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'#fff');g.addColorStop(.35,col);g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,TAU);c.fill();}
function jag(x1,y1,x2,y2,n,amp){const pts=[[x1,y1]],dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L;for(let i=1;i<n;i++){const t=i/n,o=R(-amp,amp);pts.push([x1+dx*t+nx*o,y1+dy*t+ny*o]);}pts.push([x2,y2]);return pts;}
function poly(c,pts){c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.stroke();}
function diamond(c,x,y,ang,L,Wd){c.save();c.translate(x,y);c.rotate(ang);c.beginPath();c.moveTo(L,0);c.lineTo(0,-Wd);c.lineTo(-L*.6,0);c.lineTo(0,Wd);c.closePath();c.fill();c.restore();}
function sigil(c,x,y,r,rot,col){
  c.strokeStyle=col;c.lineWidth=2;c.shadowColor=col;c.shadowBlur=14;
  c.beginPath();c.arc(x,y,r,0,TAU);c.stroke();
  c.beginPath();c.arc(x,y,r*.82,0,TAU);c.stroke();
  c.beginPath();for(let i=0;i<=5;i++){const a=rot+i*(TAU*2/5);const px=x+Math.cos(a)*r*.82,py=y+Math.sin(a)*r*.82;i?c.lineTo(px,py):c.moveTo(px,py);}c.stroke();
  for(let i=0;i<12;i++){const a=rot+i*TAU/12;line(c,x+Math.cos(a)*r*.82,y+Math.sin(a)*r*.82,x+Math.cos(a)*r,y+Math.sin(a)*r);}
}
function drawShape(c,t,s,col,col2){
  c.fillStyle=col;c.strokeStyle=col2||col;c.shadowColor=col;c.shadowBlur=12;c.lineWidth=2.5;
  switch(t){
    case'bat':c.beginPath();c.moveTo(-s,0);c.quadraticCurveTo(-s*.5,-s*.9,0,-s*.3);c.quadraticCurveTo(s*.5,-s*.9,s,0);c.quadraticCurveTo(s*.5,-s*.2,0,s*.55);c.quadraticCurveTo(-s*.5,-s*.2,-s,0);c.fill();break;
    case'arrow':c.lineWidth=3;line(c,-s*1.6,0,s,0);c.beginPath();c.moveTo(s*1.4,0);c.lineTo(s*.6,-s*.35);c.lineTo(s*.6,s*.35);c.closePath();c.fill();break;
    case'star':c.beginPath();for(let i=0;i<8;i++){const r=i%2?s*.3:s,a=i*Math.PI/4;c.lineTo(Math.cos(a)*r,Math.sin(a)*r);}c.closePath();c.fill();break;
    case'disc':c.beginPath();c.arc(0,0,s,0,TAU);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(0,0,s*.72,0,TAU);c.fill();c.fillStyle=col2||col;c.beginPath();c.arc(0,0,s*.55,0,TAU);c.fill();c.fillStyle='#fff';c.beginPath();for(let i=0;i<10;i++){const r=i%2?s*.17:s*.4,a=-Math.PI/2+i*Math.PI/5;c.lineTo(Math.cos(a)*r,Math.sin(a)*r);}c.closePath();c.fill();break;
    case'bullet':c.lineWidth=3.2;line(c,-s,0,s,0);break;
    case'dagger':c.beginPath();c.moveTo(s*1.3,0);c.lineTo(-s*.4,-s*.3);c.lineTo(-s*.9,0);c.lineTo(-s*.4,s*.3);c.closePath();c.fill();break;
    case'card':c.fillRect(-s*.5,-s*.75,s,s*1.5);break;
    case'ring':c.lineWidth=5;c.beginPath();c.arc(0,0,s,0,TAU);c.stroke();break;
    case'moon':c.beginPath();c.arc(0,0,s,-Math.PI/2,Math.PI/2);c.bezierCurveTo(s*.2,s*.6,s*.2,-s*.6,0,-s);c.fill();break;
    default:c.beginPath();c.arc(0,0,s,0,TAU);c.fill();
  }
}
function ring(x,y,col,r){add(400,(c,p)=>{c.globalAlpha=1-p;glow(c,col,5*(1-p)+1,20);c.beginPath();c.arc(x,y,r*p+10,0,TAU);c.stroke();c.globalAlpha=(1-p)*.5;orb(c,x,y,r*.6*(1-p)+8,col);});}
function flash(col,a){if(!flashEl)return;flashEl.style.background=col;flashEl.animate([{opacity:a},{opacity:0}],{duration:280,easing:'ease-out'});}
function shake(n){if(!stage)return;const kf=[];for(let i=0;i<7;i++)kf.push({transform:'translate('+R(-n,n)+'px,'+R(-n,n)*.6+'px)'});kf.push({transform:'translate(0,0)'});stage.animate(kf,{duration:280});}
function pop(x,y,text,color,big){
  const e=document.createElement('div');e.className='a3d-dmg'+(big?' big':'');e.textContent=text;e.style.left=x+'px';e.style.top=y+'px';if(!big)e.style.color=color;
  dmgLayer.appendChild(e);
  const an=e.animate([{transform:'translate(-50%,0) scale(.4)',opacity:0},{transform:'translate(-50%,-14px) scale(1.25)',opacity:1,offset:.2},{transform:'translate(-50%,-64px) scale(1)',opacity:0}],{duration:950,easing:'ease-out'});
  an.onfinish=()=>e.remove();
}
function ghosts(side,dx){
  const s=S[side];
  for(let i=1;i<=4;i++)later(()=>{
    const g=s.body.cloneNode(true);g.classList.add('a3d-ghost');
    s.root.appendChild(g);
    const f=Math.min(1,(i*38)/260),tx=dx*f;
    g.animate([{transform:'translate3d('+tx+'px,-8px,100px)',opacity:.45},{transform:'translate3d('+tx+'px,-8px,100px)',opacity:0}],{duration:340}).onfinish=()=>g.remove();
  },i*38);
}

/* ════════════════════════════════════
   EFFEKT NÖVLƏRİ — hər biri zərbənin dəyəcəyi ms-i qaytarır
════════════════════════════════════ */
const FXG={
  /* göz şüası (Superman, Homelander) və ya güclü şüa (Iron Man, Vision) */
  laser(A,B,o,d){
    const sx=A.x+d*A.w*.18,sy=A.y-A.h*.2;
    add(560,(c,p)=>{
      const a=p<.12?p/.12:p>.75?(1-p)/.25:1,tx=B.x+R(-4,4),ty=B.y-B.h*.08+R(-4,4);
      const srcs=o.eyes?[[sx,sy-5],[sx,sy+6]]:[[A.x+d*A.w*.42,A.y]];
      c.globalAlpha=a;
      srcs.forEach(s=>{
        glow(c,o.c2,(o.eyes?10:28)*a,28);line(c,s[0],s[1],tx,ty);
        glow(c,o.c,(o.eyes?5:15)*a,14);line(c,s[0],s[1],tx,ty);
        glow(c,'#fff',(o.eyes?1.6:5)*a,6);line(c,s[0],s[1],tx,ty);
        orb(c,s[0],s[1],(o.eyes?14:30)*a,o.c);
      });
      spawn(tx,ty,R(-4,4),R(-5,1),240,R(2,4),o.c,{shape:'l',d:.93});
    });
    return 110;
  },
  lightning(A,B,o,d){
    flash(o.c,.4);
    let step=-1,bolts=[];
    add(520,(c,p)=>{
      const st=(p*14)|0;
      if(st!==step){step=st;bolts=[jag(B.x+R(-50,50),-10,B.x,B.y,10,28),jag(A.x+d*A.w*.3,A.y-A.h*.25,B.x,B.y,8,22),jag(B.x,B.y,B.x+R(-90,90),B.y+R(-70,70),5,16)];}
      c.globalAlpha=p>.55?(1-p)/.45:1;c.lineJoin='round';
      bolts.forEach((b,i)=>{glow(c,o.c2,i===0?9:5,26);poly(c,b);glow(c,'#fff',i===0?3:1.6,8);poly(c,b);});
      if(Math.random()<.5)spawn(B.x+R(-30,30),B.y+R(-40,40),R(-2,2),R(-3,0),260,3,o.c,{shape:'l'});
    });

  },
  /* enerji topu (Thanos üçün rəngli daşlarla) */
  energy(A,B,o,d){

    add(C,(c,p)=>{orb(c,sx,sy,(6+22*p)*1.6,col());const a=R(0,TAU);spawn(sx+Math.cos(a)*54,sy+Math.sin(a)*54,-Math.cos(a)*3,-Math.sin(a)*3,220,3,col(),{d:.96});});
    add(T,(c,p)=>{
      const x=sx+(B.x-sx)*p,y=sy+(B.y-sy)*p-Math.sin(p*Math.PI)*18;
      orb(c,x,y,30,o.c);
      if(o.pal)for(let i=0;i<o.pal.length;i++){const a=p*14+i*TAU/o.pal.length;orb(c,x+Math.cos(a)*24,y+Math.sin(a)*24,8,o.pal[i]);}

  },
  /* alov / su axını */
  stream(A,B,o,d){

      const n=Math.max(1,Math.round(dt/16*6)),dx=B.x-sx,dy=B.y-sy,L=Math.hypot(dx,dy)||1;
      for(let i=0;i<n;i++){const sp=R(11,16);spawn(sx,sy+R(-8,8),dx/L*sp+R(-1.4,1.4),dy/L*sp+R(-2,2),R(240,380),R(6,13),pick(o.pal),{d:.988,g:o.g==null?-.03:o.g,grow:1.4});}
      orb(c,sx,sy,26,o.c);

  /* caynaq / qılınc cızıqları */
  slash(A,B,o,d){

      const q=Math.min(1,p*2.4),a=p<.5?1:(1-p)*2;
      const x1=B.x+d*(-60+k*28),y1=B.y-B.h*.38,x2=B.x+d*(20+k*28),y2=B.y+B.h*.32;

    },T+k*70);
    for(let k=0;k<3;k++)later(()=>burst(B.x+d*k*20,B.y+R(-30,30),8,o.c,5,260,2.5,{shape:'l'}),T+k*70+80);
    return T;
  },
  /* sürət: iz, xətlər, çoxlu kiçik zərbə */
  speed(A,B,o,d){
    const T=250;
    ghosts(A.side,(B.x-A.x)-d*B.w*.72);
    add(T+150,(c,p)=>{const px=A.x+(B.x-A.x)*Math.min(1,p*2.4);for(let i=0;i<3;i++)spawn(px+R(-20,20),A.y+R(-A.h*.4,A.h*.4),-d*R(8,16),0,220,R(1.5,3),pick([o.c,'#fff']),{shape:'l',d:.9});});
    for(let i=1;i<=5;i++)later(()=>{burst(B.x+R(-25,25),B.y+R(-40,40),8,o.c,5,260,3,{shape:'l'});flash(o.c,.08);},T+i*55);

  },
  /* möhkəm zərbə: şok dalğası + qırıntılar */
  smash(A,B,o,d){

    later(()=>{
      add(520,(c,p)=>{c.globalAlpha=1-p;glow(c,o.c,6*(1-p)+1,20);c.beginPath();c.ellipse(B.x,gy,30+p*230,8+p*44,0,0,TAU);c.stroke();});
      add(420,(c,p)=>{c.globalAlpha=(1-p)*.8;glow(c,'#fff',3,10);c.beginPath();c.ellipse(B.x,gy,20+p*140,6+p*28,0,0,TAU);c.stroke();},60);
      for(let i=0;i<18;i++)spawn(B.x+R(-50,50),gy,R(-4,4),R(-11,-3),R(500,800),R(3,7),pick([o.c,o.c2,'#b0a99a']),{shape:'r',g:.45,d:.99,vr:R(-.3,.3)});
      for(let i=0;i<10;i++)spawn(B.x+R(-90,90),gy,R(-2,2),R(-1.5,-.3),R(600,900),R(10,20),'rgba(150,140,120,.45)',{op:'source-over',grow:1});
      shake(16);
    },T-20);

  },
  /* sehr: dairəvi möhür + spiral qığılcımlar */
  magic(A,B,o,d){
    const sx=A.x+d*A.w*.45,sy=A.y;
    add(320,(c,p)=>{c.globalAlpha=p<.2?p*5:p>.8?(1-p)*5:1;sigil(c,sx,sy,44+p*10,p*5,o.c);sigil(c,sx,sy,26,-p*6,o.c2);});
    add(340,(c,p)=>{
      c.globalAlpha=1;
      for(let i=0;i<9;i++){const t=Math.max(0,Math.min(1,p*1.25-i*.03)),x=sx+(B.x-sx)*t,y=sy+(B.y-sy)*t+Math.sin(t*9+i)*26*Math.sin(t*Math.PI);orb(c,x,y,8+(i%3)*3,i%2?o.c:o.c2);}
    },150);
    add(520,(c,p)=>{c.globalAlpha=p<.15?p*6.6:(1-p);sigil(c,B.x,B.y+B.h*.1,70+p*40,-p*4,o.c);sigil(c,B.x,B.y+B.h*.1,40,p*5,o.c2);},400);
    return 480;
  },
  ice(A,B,o,d){
    const sx=A.x+d*A.w*.4,sy=A.y;
    burst(sx,sy,14,'#e1f5fe',4,400,3,{shape:'l'});
    for(let k=0;k<5;k++){
      const oy=(k-2)*16;
      add(300,(c,p)=>{const x=sx+(B.x-sx)*p,y=sy+oy+(B.y-sy-oy)*p,ang=Math.atan2(B.y-sy-oy,B.x-sx);c.fillStyle=k%2?o.c:'#e1f5fe';c.shadowColor=o.c;c.shadowBlur=16;diamond(c,x,y,ang,26,8);},k*50);

  },
  psychic(A,B,o,d){
    const sx=A.x+d*A.w*.2,sy=A.y-A.h*.25;
    add(300,(c,p)=>{c.globalAlpha=1-p*.5;orb(c,sx,sy,30+p*20,o.c);});
    add(520,(c,p)=>{
      for(let k=0;k<5;k++){const t=p*1.4-k*.14;if(t<0||t>1)continue;const x=sx+(B.x-sx)*t,y=sy+(B.y-sy)*t,r=16+t*54;c.globalAlpha=(1-t)*.9;glow(c,k%2?o.c2:o.c,3,16);c.beginPath();c.ellipse(x,y,r*.45,r,0,0,TAU);c.stroke();}

  magnet(A,B,o,d){
    const sx=A.x+d*A.w*.35,sy=A.y-A.h*.1;
    add(460,(c,p)=>{
      c.globalAlpha=(p>.7?(1-p)/.3:1)*.85;
      for(let k=0;k<3;k++){glow(c,k?o.c2:o.c,2.5,14);c.beginPath();c.moveTo(sx,sy);c.bezierCurveTo(sx+(B.x-sx)*.3,sy-70-k*25+Math.sin(p*20+k)*8,sx+(B.x-sx)*.7,B.y-60-k*20,B.x,B.y);c.stroke();}
      if(p<.55){const dx=B.x-sx,dy=B.y-sy,L=Math.hypot(dx,dy)||1;for(let i=0;i<2;i++){const sp=R(12,17);spawn(sx,sy+R(-30,30),dx/L*sp,dy/L*sp+R(-2,1),R(260,360),R(4,7),pick(['#cfd8dc','#90a4ae','#eceff1']),{shape:'r',vr:R(-.4,.4),d:.995,op:'source-over'});}}
    });
    return 320;
  },
  /* atılan əşyalar: batarang, ox, qalxan, güllə, xəncər... */
  proj(A,B,o,d){
    const n=o.n||3,T=o.T||300,sx=A.x+d*A.w*.4,sy=A.y,gap=o.gap||70,hitT=o.ret?T*.5:T;
    for(let k=0;k<n;k++){
      const oy=(k-(n-1)/2)*(o.spread==null?18:o.spread),dl=k*gap;
      add(T,(c,p)=>{
        const q=o.ret?(p<.5?p*2:(1-p)*2):p,ex=B.x,ey=B.y+oy*.5;
        const x=sx+(ex-sx)*q,y=sy+oy+(ey-sy-oy)*q-Math.sin(q*Math.PI)*(o.arc==null?14:o.arc);
        c.save();c.translate(x,y);c.rotate(o.spin?p*o.spin:Math.atan2(ey-sy-oy,ex-sx));drawShape(c,o.sh,o.sz||15,o.c,o.c2);c.restore();
        spawn(x,y,R(-1,1),R(-1,1),200,R(2,4),o.c,{d:.93});
      },dl);
      later(()=>burst(B.x+R(-15,15),B.y+oy*.5+R(-10,10),6,o.c,4,240,2.5,{shape:'l'}),dl+hitT);
    }
    return hitT+Math.floor(n/2)*gap;
  },
  web(A,B,o,d){
    const sx=A.x+d*A.w*.42,sy=A.y-A.h*.05;
    add(260,(c,p)=>{
      const q=Math.min(1,p*2.4);c.globalAlpha=p>.7?(1-p)/.3:1;glow(c,'#fff',2,10);
      for(let k=0;k<4;k++){const ty=B.y+(k-1.5)*26,tx=B.x;c.beginPath();c.moveTo(sx,sy);c.quadraticCurveTo(sx+(tx-sx)*q*.5,sy+(ty-sy)*q*.5+Math.sin(q*6+k)*6,sx+(tx-sx)*q,sy+(ty-sy)*q);c.stroke();}
    });
    add(520,(c,p)=>{
      c.globalAlpha=1-p;glow(c,'#fff',1.6,8);const r=70+p*10;
      for(let i=0;i<8;i++){const a=i*Math.PI/4;line(c,B.x,B.y,B.x+Math.cos(a)*r,B.y+Math.sin(a)*r);}
      for(let k=1;k<=3;k++){c.beginPath();c.arc(B.x,B.y,r*k/3,0,TAU);c.stroke();}

    return 220;
  },
  /* simbiot / mexaniki qollar */
  tendril(A,B,o,d){
    const sx=A.x+d*A.w*.3,sy=A.y+A.h*.1;
    add(520,(c,p)=>{
      c.globalCompositeOperation='source-over';
      const q=Math.min(1,p*3);c.globalAlpha=p>.65?(1-p)/.35:1;
      for(let k=0;k<5;k++){
        const ty=B.y+(k-2)*22,pts=[];
        for(let i=0;i<=24;i++){const t=i/24*q;pts.push([sx+(B.x-sx)*t,sy+(ty-sy)*t+Math.sin(t*10+p*14+k*1.3)*18*Math.sin(t*Math.PI)]);}
        glow(c,o.c,10,10);c.strokeStyle=o.c2;poly(c,pts);
        glow(c,o.c,3.4,6);c.strokeStyle=o.c;poly(c,pts);
      }
    });
    return 200;
  }
};

function cast(as,bs,hero,dmg,onHit){
  const A=anchor(as),B=anchor(bs),d=A.x<B.x?1:-1,o=prof(hero),melee=MELEE[o.t];
  const dist=B.x-A.x,dx=melee?dist-d*B.w*.72:d*22;
  S[as].body.animate(melee?[
    {transform:'translate3d(0,0,0)'},
    {transform:'translate3d('+(-d*16)+'px,0,-10px) scale(.97)',offset:.2},
    {transform:'translate3d('+dx+'px,-8px,110px) scale(1.08)',offset:.42},
    {transform:'translate3d('+dx+'px,-8px,110px) scale(1.08)',offset:.58},
    {transform:'translate3d(0,0,0)'}
  ]:[
    {transform:'translate3d(0,0,0)'},
    {transform:'translate3d('+(-d*18)+'px,0,-20px) scale(.97)',offset:.25},
    {transform:'translate3d('+(d*26)+'px,-6px,60px) scale(1.07)',offset:.5},
    {transform:'translate3d(0,0,0)'}
  ],{duration:melee?620:560,easing:'ease-in-out'});
  const hitAt=FXG[o.t](A,B,o,d)||200;
  later(()=>{
    const big=dmg>=60;
    burst(B.x,B.y,big?26:16,o.c,6,520,5,{d:.94});
    burst(B.x,B.y,8,'#fff',9,300,3,{shape:'l',d:.92});
    ring(B.x,B.y,o.c,big?120:80);
    hitReact(bs,dmg,d);
    pop(B.x,B.y-B.h*.35,'-'+dmg,o.c,big);
    shake(big?10:6);flash(o.c,big?.32:.16);
    try{if(window.SFX&&SFX.fightHit)SFX.fightHit();}catch(e){}
    if(onHit)onHit();
  },hitAt);
}
function hitReact(side,dmg,d){
  const s=S[side],k=Math.min(46,14+dmg*.35);
  s.body.animate([
    {transform:'translate3d(0,0,0)'},
    {transform:'translate3d('+(d*k)+'px,-4px,-30px) rotateZ('+(d*5)+'deg)',offset:.3},
    {transform:'translate3d(0,0,0)'}
  ],{duration:380,easing:'ease-out'});
  const hf=s.card.querySelector('.a3d-hitflash');
  if(hf)hf.animate([{opacity:0},{opacity:.85},{opacity:0}],{duration:260});
}
function attack(h1,h2,d1,d2,onHp){
  if(!init())return false;
  if(!W)resize();
  cast('left','right',h1,d2,()=>onHp&&onHp('right'));
  later(()=>cast('right','left',h2,d1,()=>onHp&&onHp('left')),720);
  return true;
}
function ko(sides){
  if(!ready||!sides||!sides.length)return;
  sides.forEach(side=>{
    const s=S[side],a=anchor(side),dir=side==='left'?-1:1,col=s.color||'#ffd54f';
    s.body.animate([
      {transform:'translate3d(0,0,0) rotateZ(0deg)',opacity:1},
      {transform:'translate3d('+(dir*30)+'px,-30px,40px) rotateZ('+(dir*12)+'deg)',opacity:1,offset:.3},
      {transform:'translate3d('+(dir*90)+'px,50px,-80px) rotateZ('+(dir*80)+'deg)',opacity:0}
    ],{duration:900,easing:'ease-in',fill:'forwards'});
    burst(a.x,a.y,44,col,7,800,6,{g:.15,d:.96});
    burst(a.x,a.y,20,'#fff',10,400,3,{shape:'l',d:.93});
    ring(a.x,a.y,col,160);
    pop(a.x,a.y-a.h*.3,'K.O.','#fff',true);
  });
  shake(16);flash('#fff',.5);
}
function heroByName(n){try{return HEROES.find(h=>h.name===n)||{name:n,color:'#ffd54f'};}catch(e){return{name:n,color:'#ffd54f'};}}
function playRemote(fx){
  if(!init()||!fx)return;
  if(!W)resize();
  if(fx.k==='attack'){
    cast('left','right',heroByName(fx.a),fx.d2);
    later(()=>cast('right','left',heroByName(fx.b),fx.d1),720);
  } else if(fx.k==='ko')ko(fx.sides);
}
function reset(){
  tmr.splice(0).forEach(clearTimeout);
  items.length=0;parts.length=0;cur.left=cur.right=null;
  if(ready){
    ['left','right'].forEach(s=>{S[s].body.getAnimations().forEach(a=>a.cancel());S[s].root.querySelectorAll('.a3d-ghost').forEach(g=>g.remove());});
    dmgLayer.innerHTML='';
    if(W)cx.clearRect(0,0,W,H);
  }
}

window.Arena3D={ready:init,setFighter:setFighter,attack:attack,ko:ko,reset:reset,playRemote:playRemote};

/* ════════════════════════════════════
   MÖVCUD OYUN KODUNA QOŞULMA (heç nəyi əl ilə dəyişmək lazım deyil)
════════════════════════════════════ */
function wrapFn(name,fn){const o=window[name];if(typeof o!=='function')return;window[name]=function(){return fn(o,this,arguments);};}

wrapFn('renderFighter',(o,t,a)=>{const r=o.apply(t,a);Arena3D.setFighter(a[0],a[1]);return r;});
wrapFn('startBattle',(o,t,a)=>{Arena3D.reset();return o.apply(t,a);});
wrapFn('applySync',(o,t,a)=>{if(a[0]&&a[0].screen!=='battle')Arena3D.reset();return o.apply(t,a);});
wrapFn('resolveWinner',(o,t,a)=>{
  const sides=[];if(a[0].curHp<=0)sides.push('left');if(a[1].curHp<=0)sides.push('right');
  Arena3D.ko(sides);
  try{if(onlineMode&&isHost&&conn&&conn.open)conn.send({type:'fx3d',fx:{k:'ko',sides:sides}});}catch(e){}
  return o.apply(t,a);
});
wrapFn('setupConn',(o,t,a)=>{
  const r=o.apply(t,a);
  try{conn.on('data',d=>{if(d&&d.type==='fx3d')Arena3D.playRemote(d.fx);});}catch(e){}
  return r;
});

/* döyüş addımı: hücum animasiyası + zərbə anında can azalması */
window.simStep=function(){
  const h1=battleState.t1[battleState.idx1],h2=battleState.t2[battleState.idx2];
  if(!h1||!h2)return;
  const s1=h1.speed>=h2.speed?1.1:0.9,s2=h2.speed>=h1.speed?1.1:0.9;
  const d2=Math.max(10,Math.round((h1.power*1.5-h2.defense*0.8)*s1+rand(-5,5)));
  const d1=Math.max(10,Math.round((h2.power*1.5-h1.defense*0.8)*s2+rand(-5,5)));
  h2.curHp-=d2;h1.curHp-=d1;
  const used=Arena3D.attack(h1,h2,d1,d2,side=>renderFighter(side,side==='left'?h1:h2));
  if(!used){renderFighter('left',h1);renderFighter('right',h2);}
  const log=document.getElementById('battleLog'),le=document.createElement('div');le.className='log-item';
  le.innerHTML='<span><b>'+h1.name+'</b> (-'+d1+')</span><span><b>'+h2.name+'</b> (-'+d2+')</span>';
  log.prepend(le);battleState.history.push({n1:h1.name,n2:h2.name,d1:d1,d2:d2});
  if(onlineMode&&isHost){
    syncGuest();
    try{if(conn&&conn.open)conn.send({type:'fx3d',fx:{k:'attack',a:h1.name,b:h2.name,d1:d1,d2:d2}});}catch(e){}
  }
  const wait=used?1500:700;
  if(h1.curHp<=0||h2.curHp<=0)setTimeout(()=>resolveWinner(h1,h2),wait);
  else setTimeout(window.simStep,wait);
};

init();
})();
</script>
