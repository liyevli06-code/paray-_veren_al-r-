<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qəhrəmanlar Döyüşü - Hero Battle Arena</title>
    <style>
        :root {
            --primary: #e50914;
            --dark: #0f1115;
            --card-bg: #1a1d24;
            --accent: #00d2ff;
            --tier-s: #ff4757;
            --tier-a: #ffa502;
            --tier-b: #2ed573;
            --tier-c: #1e90ff;
            --text: #ffffff;
            --text-dim: #a0a5b5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dark);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
            text-shadow: 0 0 10px rgba(0,210,255,0.5);
        }

        /* Filter Controls */
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            background: var(--card-bg);
            border: 1px solid #333;
            color: var(--text);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--accent);
            color: #000;
            font-weight: bold;
            border-color: var(--accent);
        }

        /* Hero Grid */
        .hero-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        /* Hero Card */
        .hero-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            border: 1px solid #2a2e39;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .hero-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .hero-name {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .hero-tier {
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .tier-S { background: var(--tier-s); color: #fff; }
        .tier-A { background: var(--tier-a); color: #000; }
        .tier-B { background: var(--tier-b); color: #000; }
        .tier-C { background: var(--tier-c); color: #fff; }

        .franchise {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 12px;
        }

        .bio {
            font-size: 0.9rem;
            color: #ccc;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        /* Stats Bars */
        .stats {
            margin-bottom: 15px;
        }

        .stat-row {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
            font-size: 0.8rem;
        }

        .stat-name {
            width: 70px;
            color: var(--text-dim);
        }

        .stat-bar-bg {
            flex-grow: 1;
            background: #2a2e39;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin: 0 8px;
        }

        .stat-bar-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 4px;
        }

        .stat-val {
            width: 25px;
            text-align: right;
            font-weight: bold;
        }

        /* Ability Box */
        .ability-box {
            background: rgba(0, 0, 0, 0.3);
            border-left: 3px solid var(--accent);
            padding: 10px;
            border-radius: 0 6px 6px 0;
            font-size: 0.85rem;
        }

        .ability-title {
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 4px;
        }

        .ability-desc {
            color: var(--text-dim);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <h1>Qəhrəmanlar Döyüş Arenası</h1>

    <!-- Filter Buttons -->
    <div class="controls">
        <button class="filter-btn active" onclick="filterHeroes('all')">Hamısı</button>
        <button class="filter-btn" onclick="filterHeroes('S')">Tier S</button>
        <button class="filter-btn" onclick="filterHeroes('A')">Tier A</button>
        <button class="filter-btn" onclick="filterHeroes('B')">Tier B</button>
        <button class="filter-btn" onclick="filterHeroes('C')">Tier C</button>
    </div>

    <!-- Container for Hero Cards -->
    <div class="hero-grid" id="heroGrid"></div>

    <script>
        // Qəhrəmanlar Massivi (Kanonik və Balanslaşdırılmış)

            }

          {
            id: "zeus",
            name: "Zeus",
            franchise: "Mythology",
            tier: "S",
            stats: { power: 95, speed: 88, intelligence: 90, combat: 90 },
            bio: "Olimpin Hökmdarı. Göy gurultusu və ildırımların mütləq hakimi.",
            ability: {

            }
          },

          // TIER A — Yüksək Səviyyəli Metainsanlar
          {
            id: "homelander",
            name: "Homelander",
            franchise: "The Boys",
            tier: "A",
            stats: { power: 90, speed: 88, intelligence: 65, combat: 72 },
            bio: "V Birləşməsi ilə yaradılmış ən güclü supe. Çox güclüdür, lakin peşəkar döyüş təcrübəsi zəifdir.",
            ability: {
              name: "Lazer Baxışı və Qəzəb",
              desc: "Gözlərindən saçan termik lazerlə rəqibin zirehini tamamilə sıradan çıxarır."
            }
          },
          {

            name: "Wonder Woman",
            franchise: "DC",
            tier: "A",

            bio: "Amazon şahzadəsi Diana. Əsrlərlə cilalanmış döyüş sənəti və ilahi zirehlər sahibi.",

          {

          // TIER B — Təcrübəli Döyüşçülər
          {

          // TIER C — İnsan Səviyyəli Döyüşçülər
          {
            id: "captain_america",
            name: "Captain America",
            franchise: "Marvel",
            tier: "C",
            stats: { power: 60, speed: 62, intelligence: 78, combat: 95 },
            bio: "Super Əsgər zərdabı və Vibranium qalxan sahibi. Mütləq lider və taktikdir.",
            ability: {
              name: "Vibranium Qalxan",
              desc: "Gələn ilk 2 ağır zərbənin zərərini tam neytrallaşdırır."
            }
          },
          {
            id: "billy_butcher",
            name: "Billy Butcher (Temp-V)",
            franchise: "The Boys",
            tier: "C",
            stats: { power: 78, speed: 70, intelligence: 82, combat: 80 },
            bio: "Müvəqqəti V zərdabı qəbul etmiş anti-qəhrəman. Lazer baxışına və yüksək dözümlülüyə malikdir.",
            ability: {
              name: "Yandırılmış Torpaq",
              desc: "Öz sağlamlığından 10% xərcləyərək rəqibə 2 qat kritik zərər vurur."
            }
          },
          {
            id: "green_arrow",
            name: "Green Arrow",
            franchise: "DC",
            tier: "C",
            stats: { power: 48, speed: 65, intelligence: 80, combat: 88 },
            bio: "Sərrast oxatan və şəhər döyüşçüsü. Müxtəlif xüsusi başlıqlı oxlardan istifadə edir.",
            ability: {
              name: "Xüsusi Oxlar",
              desc: "Rəqibi donduran, tora salan və ya zəiflədən oxlar ataraq onun xallarını endirir."
            }
          }
        ];

        // Kartları Ekrana Çıxaran Funksiya
        function renderHeroes(heroList) {
            const grid = document.getElementById('heroGrid');
            grid.innerHTML = '';

            heroList.forEach(hero => {
                const card = document.createElement('div');
                card.className = 'hero-card';

                card.innerHTML = `
                    <div>
                        <div class="card-header">
                            <span class="hero-name">${hero.name}</span>
                            <span class="hero-tier tier-${hero.tier}">Tier ${hero.tier}</span>
                        </div>
                        <div class="franchise">${hero.franchise}</div>
                        <div class="bio">${hero.bio}</div>
                        
                        <div class="stats">
                            <div class="stat-row">
                                <span class="stat-name">Güc</span>
                                <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${hero.stats.power}%"></div></div>
                                <span class="stat-val">${hero.stats.power}</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-name">Sürət</span>
                                <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${hero.stats.speed}%"></div></div>
                                <span class="stat-val">${hero.stats.speed}</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-name">Zəka</span>
                                <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${hero.stats.intelligence}%"></div></div>
                                <span class="stat-val">${hero.stats.intelligence}</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-name">Döyüş</span>
                                <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${hero.stats.combat}%"></div></div>
                                <span class="stat-val">${hero.stats.combat}</span>
                            </div>
                        </div>
                    </div>

                    <div class="ability-box">
                        <div class="ability-title">✨ ${hero.ability.name}</div>
                        <div class="ability-desc">${hero.ability.desc}</div>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        // Tier Filteri Funksiyası
        function filterHeroes(tier) {
            // Düymələrin aktivliyini dəyişmək
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.innerText.includes(tier) || (tier === 'all' && btn.innerText === 'Hamısı')) {
                    btn.classList.add('active');
                }
            });

            if (tier === 'all') {
                renderHeroes(HEROES);
            } else {
                const filtered = HEROES.filter(h => h.tier === tier);
                renderHeroes(filtered);
            }
        }

        // İlkin yüklənmədə bütün qəhrəmanları göstər
        renderHeroes(HEROES);
    </script>
</body>
</html>
